name: Build system packages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when this cno-cli commit was released successfully
        type: boolean
        default: false
      publish:
        description: Publish the package set as a GitHub Release
        type: boolean
        default: true
  repository_dispatch:
    types: [cno-head]

permissions:
  contents: read

# A single lane prevents two cno-build pushes from racing to publish the same
# immutable cno-cli HEAD. A failed run leaves no success marker, so a later
# push retries it.
concurrency:
  group: packages-cno-head
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decision.outputs.build }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
      source_url: ${{ steps.source.outputs.source_url }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      release_tag: ${{ steps.decision.outputs.release_tag }}
      openwrt_ipk_release: ${{ steps.openwrt.outputs.release }}
      package_release: ${{ steps.package.outputs.release }}
      debian_matrix: ${{ steps.matrix.outputs.debian }}
      alpine_matrix: ${{ steps.matrix.outputs.alpine }}
      openwrt_matrix: ${{ steps.matrix.outputs.openwrt }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        name: Resolve immutable cno-cli HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sh scripts/resolve-cno-head.sh > source.outputs
          cat source.outputs
          cat source.outputs >> "$GITHUB_OUTPUT"
      - id: package
        name: Read package revision
        run: |
          . config/project.env
          echo "release=$CNO_PACKAGE_RELEASE" >> "$GITHUB_OUTPUT"
      - id: mode
        name: Resolve publication mode
        env:
          DISPATCH_PUBLISH: ${{ github.event.client_payload.publish }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          case '${{ github.event_name }}' in
            push) publish=true ;;
            repository_dispatch)
              case "$DISPATCH_PUBLISH" in false) publish=false ;; *) publish=true ;; esac
              ;;
            *) publish=${MANUAL_PUBLISH:-true} ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - id: decision
        name: Skip only an already successful source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.source.outputs.version }}
          PACKAGE_RELEASE: ${{ steps.package.outputs.release }}
          MANUAL_FORCE: ${{ inputs.force }}
          DISPATCH_FORCE: ${{ github.event.client_payload.force }}
        run: |
          release_tag="packages-v${VERSION}-r${PACKAGE_RELEASE}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          force=false
          case '${{ github.event_name }}' in
            workflow_dispatch) force=${MANUAL_FORCE:-false} ;;
            repository_dispatch) force=${DISPATCH_FORCE:-false} ;;
          esac
          if [ "$force" = true ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo 'Forced rebuild requested.'
            exit 0
          fi

          marker="cno-source-commit: $SOURCE_COMMIT"
          found=false
          page=1
          while :; do
            response=$(curl --fail --location --show-error --silent \
              --retry 3 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=$page")
            count=$(printf '%s' "$response" | jq 'length')
            if printf '%s' "$response" | jq -e --arg marker "$marker" \
              'any(.[]; .draft == false and ((.body // "") | split("\n") | index($marker)))' \
              >/dev/null
            then
              found=true
              break
            fi
            [ "$count" -eq 100 ] || break
            page=$((page + 1))
          done

          if [ "$found" = true ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "cno-cli $SOURCE_COMMIT was already released successfully; skipping."
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo "No successful release marker for $SOURCE_COMMIT; building."
          fi
      - id: openwrt
        if: steps.decision.outputs.build == 'true'
        name: Resolve latest OpenWrt IPK patch release
        run: echo "release=$(sh scripts/resolve-openwrt-release.sh)" >> "$GITHUB_OUTPUT"
      - id: matrix
        if: steps.decision.outputs.build == 'true'
        name: Generate package matrices from configuration
        run: |
          {
            echo "debian=$(sh scripts/config-matrix.sh debian)"
            echo "alpine=$(sh scripts/config-matrix.sh alpine)"
            echo "openwrt=$(sh scripts/config-matrix.sh openwrt)"
          } >> "$GITHUB_OUTPUT"

  source:
    name: Prepare immutable cno-cli source
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out immutable cno-cli source with submodules
        uses: actions/checkout@v4
        with:
          repository: imzlh/cno-cli
          ref: ${{ needs.prepare.outputs.commit }}
          path: work/cno-cli
          submodules: recursive
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inject package version, apply packaging patch, bundle and archive
        run: |
          actual=$(git -C work/cno-cli rev-parse HEAD)
          test "$actual" = '${{ needs.prepare.outputs.commit }}'
          sh scripts/prepare-openwrt-source.sh work/cno-cli "$actual" \
            '${{ needs.prepare.outputs.version }}' work/cno-source \
            '${{ needs.prepare.outputs.source_date_epoch }}' \
            patches/cno-cli-openwrt-cross-abi.patch
      - uses: actions/upload-artifact@v4
        with:
          name: cno-source-${{ needs.prepare.outputs.commit }}
          path: work/cno-source/
          if-no-files-found: error
          retention-days: 3

  linux-input:
    name: Linux input ${{ matrix.libc }} ${{ matrix.target }}
    needs: [prepare, source]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {libc: glibc-minimal, target: x86_64, platform: linux/amd64, image: 'debian:bookworm-slim', runner: ubuntu-24.04}
          - {libc: glibc-minimal, target: i386, platform: linux/386, image: 'debian:bookworm-slim', runner: ubuntu-24.04}
          - {libc: glibc-minimal, target: arm64, platform: linux/arm64, image: 'debian:bookworm-slim', runner: ubuntu-24.04-arm}
          - {libc: glibc-minimal, target: armv7, platform: linux/arm/v7, image: 'debian:bookworm-slim', runner: ubuntu-24.04-arm}
          - {libc: musl-dynamic, target: x86_64, platform: linux/amd64, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl-dynamic, target: i386, platform: linux/386, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl-dynamic, target: arm64, platform: linux/arm64, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl-dynamic, target: armv7, platform: linux/arm/v7, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl-dynamic, target: armv6, platform: linux/arm/v6, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cno-source-${{ needs.prepare.outputs.commit }}
          path: work/cno-source
      - name: Unpack the exact versioned source
        run: |
          mkdir work/cno-cli
          tar -xzf 'work/cno-source/cno-source-${{ needs.prepare.outputs.version }}.tar.gz' \
            --strip-components=1 -C work/cno-cli
          mkdir -p work/cno-cli/dist
          cp 'work/cno-source/cno-cli-${{ needs.prepare.outputs.version }}.min.js' \
            work/cno-cli/dist/cno-cli.min.js
      - uses: dtolnay/rust-toolchain@stable
      - name: Build OXC Rust archive on the runner
        working-directory: work/cno-cli
        env:
          CNO_OXC_RUST_TOOLCHAIN: 1.95.0
        run: |
          sh scripts/ci/oxc/build-linux.sh --prepare \
            '${{ startsWith(matrix.libc, 'glibc') && 'glibc' || 'musl' }}' \
            '${{ matrix.target }}' build-oxc-rust
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,386
      - name: Build archive inside the target platform
        env:
          LIBC: ${{ matrix.libc }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE/work/cno-cli:/work" -w /work \
            -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            -e CNO_OXC_RUST_ARCHIVE=/work/build-oxc-rust/libcjs_oxc_core.a \
            "$IMAGE" sh scripts/ci/linux/build.sh "$LIBC" "$TARGET" false
      - uses: actions/upload-artifact@v4
        with:
          name: cno-linux-${{ matrix.libc }}-${{ matrix.target }}-${{ needs.prepare.outputs.commit }}
          path: work/cno-cli/artifacts/*.tar.gz
          if-no-files-found: error

  linux-input-cross:
    name: Linux input musl-dynamic riscv64
    needs: [prepare, source]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cno-source-${{ needs.prepare.outputs.commit }}
          path: work/cno-source
      - name: Unpack the exact versioned source
        run: |
          mkdir work/cno-cli
          tar -xzf 'work/cno-source/cno-source-${{ needs.prepare.outputs.version }}.tar.gz' \
            --strip-components=1 -C work/cno-cli
          mkdir -p work/cno-cli/dist
          cp 'work/cno-source/cno-cli-${{ needs.prepare.outputs.version }}.min.js' \
            work/cno-cli/dist/cno-cli.min.js
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            zip unzip tar xz-utils autoconf automake libtool perl bison flex \
            qemu-user
      - name: Build dynamic musl archive
        working-directory: work/cno-cli
        env:
          CNO_RUN_TESTS: 'false'
          CNO_STATIC_LINK: 'false'
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          set +e
          bash scripts/ci/linux/cross.sh riscv64 2>&1 | tee "$RUNNER_TEMP/riscv64-build.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '::group::RISC-V build failure tail'
              tail -n 200 "$RUNNER_TEMP/riscv64-build.log"
              echo '::endgroup::'
              echo '::error title=RISC-V cross build failed::Last 200 log lines are printed above.'
            } >&2
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cno-linux-musl-dynamic-riscv64-${{ needs.prepare.outputs.commit }}
          path: work/cno-cli/artifacts/cno-linux-musl-dynamic-riscv64.tar.gz
          if-no-files-found: error

  deb:
    name: DEB ${{ matrix.deb_arch }}
    needs: [prepare, linux-input]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.debian_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cno-linux-glibc-minimal-${{ matrix.cno_target }}-${{ needs.prepare.outputs.commit }}
          path: downloads
      - name: Build Debian package
        run: |
          sh scripts/build-deb.sh '${{ needs.prepare.outputs.version }}' \
            '${{ matrix.deb_arch }}' \
            'downloads/cno-linux-minimal-${{ matrix.cno_target }}.tar.gz' \
            'dist/deb/${{ matrix.deb_arch }}' \
            '${{ needs.prepare.outputs.source_date_epoch }}'
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,386
      - name: Install, execute and purge in clean Debian
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          PACKAGE_RELEASE: ${{ needs.prepare.outputs.package_release }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -e VERSION -e DEB_ARCH -v "$GITHUB_WORKSPACE:/work:ro" "$IMAGE" \
            sh /work/scripts/smoke-deb.sh \
              "/work/dist/deb/$DEB_ARCH/cno_${VERSION}-${PACKAGE_RELEASE}_${DEB_ARCH}.deb" "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-deb-${{ matrix.deb_arch }}
          path: dist/deb/${{ matrix.deb_arch }}/*.deb
          if-no-files-found: error

  alpine:
    name: Alpine APK ${{ matrix.alpine_arch }}
    needs: [prepare, linux-input, linux-input-cross]
    if: ${{ always() && needs.prepare.outputs.build == 'true' && needs.linux-input.result == 'success' && needs.linux-input-cross.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.alpine_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cno-linux-musl-dynamic-${{ matrix.cno_target }}-${{ needs.prepare.outputs.commit }}
          path: downloads
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Build signed Alpine package on target architecture
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          ALPINE_ARCH: ${{ matrix.alpine_arch }}
          CNO_TARGET: ${{ matrix.cno_target }}
          ALPINE_SIGNING_KEY_BASE64: ${{ secrets.ALPINE_SIGNING_KEY_BASE64 }}
        run: |
          mkdir -p work/alpine "dist/alpine/$ALPINE_ARCH"
          chmod 0777 work/alpine "dist/alpine/$ALPINE_ARCH"
          if [ -n "$ALPINE_SIGNING_KEY_BASE64" ]; then
            printf '%s' "$ALPINE_SIGNING_KEY_BASE64" \
              | base64 --decode > work/alpine/release-signing.rsa
            chmod 0600 work/alpine/release-signing.rsa
          fi
          docker run --rm --platform "$PLATFORM" \
            -e VERSION -e EPOCH -e ALPINE_ARCH -e CNO_TARGET \
            -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.21 sh -eux -c '
              apk add --no-cache alpine-sdk openssl coreutils
              adduser -D builder
              addgroup builder abuild
              chown -R builder:builder /work/work/alpine "/work/dist/alpine/$ALPINE_ARCH"
              signing_key=
              if [ -f /work/work/alpine/release-signing.rsa ]; then
                mkdir -p /home/builder/.abuild
                cp /work/work/alpine/release-signing.rsa /home/builder/.abuild/release.rsa
                chown -R builder:builder /home/builder/.abuild
                chmod 0600 /home/builder/.abuild/release.rsa
                signing_key=ABUILD_PRIVATE_KEY=/home/builder/.abuild/release.rsa
              fi
              su - builder -c "$signing_key RUNNER_TEMP=/work/work/alpine \
                sh /work/scripts/build-alpine.sh $VERSION $ALPINE_ARCH \
                /work/downloads/cno-linux-musl-dynamic-$CNO_TARGET.tar.gz \
                /work/dist/alpine/$ALPINE_ARCH $EPOCH"
            '
      - name: Install, execute and uninstall in clean Alpine
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ALPINE_ARCH: ${{ matrix.alpine_arch }}
          PACKAGE_RELEASE: ${{ needs.prepare.outputs.package_release }}
        run: |
          key=$(find "dist/alpine/$ALPINE_ARCH/keys" -type f -name '*.rsa.pub' -print -quit)
          test -n "$key"
          docker run --rm --platform "$PLATFORM" \
            -e VERSION -e ALPINE_ARCH -v "$GITHUB_WORKSPACE:/work:ro" alpine:3.21 \
            sh /work/scripts/smoke-alpine.sh \
              "/work/dist/alpine/$ALPINE_ARCH/cno-${VERSION}-r${PACKAGE_RELEASE}-${ALPINE_ARCH}.apk" \
              "/work/$key" "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-alpine-${{ matrix.alpine_arch }}
          path: |
            dist/alpine/${{ matrix.alpine_arch }}/*.apk
            dist/alpine/${{ matrix.alpine_arch }}/keys/*.rsa.pub
          if-no-files-found: error

  deb-ubuntu:
    name: Ubuntu DEB ${{ matrix.deb_arch }}
    needs: [prepare, deb]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {deb_arch: amd64, platform: linux/amd64}
          - {deb_arch: arm64, platform: linux/arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages-deb-${{ matrix.deb_arch }}
          path: dist/deb/${{ matrix.deb_arch }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install, execute and purge in clean Ubuntu
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          PACKAGE_RELEASE: ${{ needs.prepare.outputs.package_release }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -e VERSION -e DEB_ARCH -v "$GITHUB_WORKSPACE:/work:ro" ubuntu:24.04 \
            sh /work/scripts/smoke-deb.sh \
              "/work/dist/deb/$DEB_ARCH/cno_${VERSION}-${PACKAGE_RELEASE}_${DEB_ARCH}.deb" "$VERSION"

  openwrt:
    name: OpenWrt ${{ matrix.format }} ${{ matrix.target }}/${{ matrix.subtarget }}
    needs: [prepare, source]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.openwrt_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cno-source-${{ needs.prepare.outputs.commit }}
          path: work/cno-source
      - name: Install OpenWrt SDK host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config curl ca-certificates \
            flex bison g++ gawk gcc-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd qemu-user
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with the official OpenWrt SDK
        env:
          FORMAT: ${{ matrix.format }}
          STABLE_RELEASE: ${{ needs.prepare.outputs.openwrt_ipk_release }}
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          CPU_TUNE: ${{ matrix.cpu_tune }}
          ENDIAN: ${{ matrix.endian }}
          FLOAT_ABI: ${{ matrix.float_abi }}
          RUST_TARGET: ${{ matrix.rust_target }}
          RUST_CPU: ${{ matrix.rust_cpu }}
          RUST_FEATURES: ${{ matrix.rust_features }}
          EMULATOR: ${{ matrix.emulator }}
          WAMR_TARGET: ${{ matrix.wamr_target }}
          WASM: ${{ matrix.wasm }}
          MACHINE_REGEX: ${{ matrix.machine_regex }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          CNO_OXC_RUST_NIGHTLY: nightly-2026-10-15
          CNO_OXC_RUST_TOOLCHAIN: 1.95.0
        shell: bash
        run: |
          if [ "$FORMAT" = ipk ]; then release=$STABLE_RELEASE; else release=snapshots; fi
          log="$RUNNER_TEMP/openwrt-$FORMAT-$TARGET-$SUBTARGET.log"
          set +e
          sh scripts/build-openwrt.sh "$FORMAT" "$release" "$TARGET" "$SUBTARGET" \
            "$EXPECTED_ARCH" "$CPU_TUNE" "$ENDIAN" "$FLOAT_ABI" \
            "$RUST_TARGET" "$RUST_CPU" "$RUST_FEATURES" \
            "$EMULATOR" "$WAMR_TARGET" "$WASM" \
            "$MACHINE_REGEX" "$VERSION" "$SOURCE_COMMIT" \
            "work/cno-source/cno-source-$VERSION.tar.gz" \
            "work/cno-source/cno-cli-$VERSION.min.js" \
            "dist/openwrt/$FORMAT/$TARGET-$SUBTARGET" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "::group::OpenWrt $FORMAT $TARGET/$SUBTARGET failure tail"
              tail -n 200 "$log"
              echo '::endgroup::'
              echo "::error title=OpenWrt $FORMAT $TARGET/$SUBTARGET failed::Last 200 log lines are printed above."
            } >&2
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: packages-openwrt-${{ matrix.format }}-${{ matrix.target }}-${{ matrix.subtarget }}
          path: |
            dist/openwrt/${{ matrix.format }}/${{ matrix.target }}-${{ matrix.subtarget }}/*.${{ matrix.format }}
            dist/openwrt/${{ matrix.format }}/${{ matrix.target }}-${{ matrix.subtarget }}/*.buildinfo
          if-no-files-found: error

  release:
    name: Assemble and publish
    needs: [prepare, deb, deb-ubuntu, alpine, openwrt]
    if: ${{ always() && needs.prepare.outputs.build == 'true' && needs.deb.result == 'success' && needs.deb-ubuntu.result == 'success' && needs.alpine.result == 'success' && needs.openwrt.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: packages-*
      - name: Assemble checksummed package set
        run: |
          sh scripts/collect-release.sh incoming release \
            '${{ needs.prepare.outputs.version }}' \
            '${{ needs.prepare.outputs.commit }}' \
            '${{ needs.prepare.outputs.source_url }}'
          find release -maxdepth 1 -type f -printf '%f\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: cno-system-packages-${{ needs.prepare.outputs.version }}-r${{ needs.prepare.outputs.package_release }}
          path: release/
          if-no-files-found: error
      - name: Create or update GitHub Release assets
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: cno ${{ needs.prepare.outputs.version }} system packages (r${{ needs.prepare.outputs.package_release }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.deb
            release/*.ipk
            release/*.apk
            release/*.rsa.pub
            release/*.buildinfo
            release/SHA256SUMS.txt
            release/RELEASE-INFO.txt
      - name: Mark source commit as successfully released
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          release=$(curl --fail --location --show-error --silent \
            --retry 3 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG")
          release_id=$(printf '%s' "$release" | jq -er .id)
          body=$(printf '%s' "$release" | jq -r '.body // ""')
          marker="cno-source-commit: $SOURCE_COMMIT"
          if ! printf '%s\n' "$body" | grep -Fx "$marker" >/dev/null; then
            body=$(printf '%s\n\n%s\n' "$body" "$marker")
            jq -n --arg body "$body" '{body: $body}' > marker.json
            curl --fail --location --show-error --silent \
              --retry 3 --retry-all-errors -X PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @marker.json \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/$release_id" >/dev/null
          fi
